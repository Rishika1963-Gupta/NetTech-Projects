<html>
<head>
    <title>Contact Detail Form</title>

    <link rel="stylesheet" href="form.css">
    <link rel="icon" type="image/png" href="images/logo.png">


    <link rel="stylesheet" href="form.css">
</head>

<body>
    <div class="form">
        <div class="details">

            <div class="title">
                <img src="images/character.jpeg" alt="User" class="user-img">
                <h1>CONTACT DETAILS</h1>
            </div>

            <p style="color: black;">Please enter the details : </p>

            <h3>First Name* : <input type="text" required></h3>
            <h3>Last Name* : <input type="text" required></h3>
            <h3>Street Address : <input type="text"></h3>
            <h3>Town/City : <input type="text"></h3>
            <h3>PostCode/Zip : <input type="number"></h3>
            <h3>Telephone : <input type="number"></h3>
            <h3>Phone No. : <input type="number"></h3>
            <h3>Email Address : <input type="email"></h3>

            <p>Fields marked * are required</p>

            <button>Submit</button>
        </div>
    </div>
</body>
</html>
